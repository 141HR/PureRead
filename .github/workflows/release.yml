name: PureRead Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v0.3.0). Optional on tag dispatch; defaults to v<pubspec version>.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit and widget tests
        run: flutter test --reporter expanded

  build_windows:
    name: Build Windows (x64)
    needs: analyze_and_test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows bundle as zip
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "build\windows\x64\runner\Release\pureread.exe" -PathType Leaf)) {
            throw "Missing Windows release executable: build\windows\x64\runner\Release\pureread.exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\pureread-windows-x64.zip" -CompressionLevel Optimal -Force

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pureread-windows-x64
          path: dist/pureread-windows-x64.zip
          if-no-files-found: error

  build_android:
    name: Build Android Split APKs
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure optional Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android/release-keystore.jks
            {
              printf 'storeFile=release-keystore.jks\n'
              printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "Configured Android release signing via android/key.properties."
          else
            rm -f android/key.properties android/release-keystore.jks
            echo "Android signing secrets not fully configured; using debug signing fallback."
          fi

      - name: Build Android split APKs
        run: flutter build apk --release --split-per-abi

      - name: Clean up signing secrets
        if: always()
        run: rm -f android/key.properties android/release-keystore.jks

      - name: Stage named Android split APKs
        run: |
          if [ ! -s build/app/outputs/mapping/release/mapping.txt ]; then
            echo "Missing or empty R8 mapping file: build/app/outputs/mapping/release/mapping.txt" >&2
            exit 1
          fi
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ ! -f "$src" ]; then
              echo "Missing expected split APK: $src" >&2
              exit 1
            fi
            cp "$src" "dist/pureread-android-${abi}.apk"
          done

      - name: Upload Android split APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pureread-android-apks
          path: |
            dist/pureread-android-arm64-v8a.apk
            dist/pureread-android-armeabi-v7a.apk
            dist/pureread-android-x86_64.apk
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    needs: [build_windows, build_android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          for f in \
            pureread-windows-x64.zip \
            pureread-android-arm64-v8a.apk \
            pureread-android-armeabi-v7a.apk \
            pureread-android-x86_64.apk; do
            if [ ! -f "$f" ]; then
              echo "Missing release artifact in dist/: $f" >&2
              exit 1
            fi
          done
          sha256sum \
            pureread-windows-x64.zip \
            pureread-android-arm64-v8a.apk \
            pureread-android-armeabi-v7a.apk \
            pureread-android-x86_64.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve release tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            PUBSPEC_VER="$(sed -n 's/^version:[[:space:]]*\([^+#[:space:]]*\).*/\1/p' pubspec.yaml | head -n1)"
            if [ -z "$PUBSPEC_VER" ]; then
              echo "Unable to resolve release tag or pubspec.yaml version" >&2
              exit 1
            fi
            TAG="v${PUBSPEC_VER}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
          name: PureRead ${{ steps.resolve_tag.outputs.tag_name }}
          prerelease: ${{ contains(steps.resolve_tag.outputs.tag_name, '-') }}
          generate_release_notes: true
          files: |
            dist/pureread-windows-x64.zip
            dist/pureread-android-arm64-v8a.apk
            dist/pureread-android-armeabi-v7a.apk
            dist/pureread-android-x86_64.apk
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
