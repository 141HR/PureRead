name: ✨ 功能建议（Feature Request）
description: 提出新功能需求、阅读体验改进或工程优化建议
title: "[Feat]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出改进建议！请先查看 [PRD 文档](https://github.com/141HR/PureRead/blob/master/docs/01-prd.md) 确认是否已在规划范围内。

  - type: dropdown
    id: target_platform
    attributes:
      label: 适用平台（Target Platform）
      options:
        - Windows & Android（全平台）
        - Windows (x64) 桌面端
        - Android 移动端
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点（Problem / Motivation）
      description: 描述在什么阅读或管理场景下遇到了不便，为什么需要这项能力
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的实现方案（Proposed Solution）
      description: 描述你期望的交互方式、配置项或功能细节
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或补充说明（Alternatives / Context）
      description: 如有其他阅读器的参考交互或边界条件，可在此补充

  - type: checkboxes
    id: compliance
    attributes:
      label: 合规确认
      options:
        - label: 我确认该建议符合 PureRead 纯本地工具定位（不内置小说内容、盗版书源或商业遥测）。
          required: true
